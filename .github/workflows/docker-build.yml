name: Manual Docker Image Build & Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish (default: latest)"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image to GitHub Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output deployment instructions
        run: |
          echo "=================================================================="
          echo "✅ Docker image built and published successfully!"
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag }}"
          echo "To update your VPS server, SSH in and run:"
          echo "  ./update.sh"
          echo "=================================================================="
