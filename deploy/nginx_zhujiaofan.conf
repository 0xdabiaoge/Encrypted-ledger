# ==============================================================================
# Encrypted Ledger - Nginx Reverse Proxy Configuration
# Domain: www.zhujiaofan.eu.cc / zhujiaofan.eu.cc
# Upstream: 127.0.0.1:8080 (Docker Compose Container)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.zhujiaofan.eu.cc zhujiaofan.eu.cc;

    # Performance & Payload Configuration
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/zhujiaofan_access.log;
    error_log /var/log/nginx/zhujiaofan_error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket & Long-Polling Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for real-time streaming & long deliberations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
