# ==============================================================================
# Encrypted Ledger - Docker Compose Production Stack
# ==============================================================================
services:
  encrypted-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encrypted-ledger-core
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATA_DIR=/app/data
      - LOGS_DIR=/app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
